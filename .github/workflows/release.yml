name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Do NOT set registry-url — it writes a placeholder NODE_AUTH_TOKEN that
      # blocks npm Trusted Publishing (OIDC). See actions/setup-node#1551.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@dappermountain/payload-plugin-achievements@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has ${VERSION}; skipping publish"
            exit 0
          fi
          # Prerelease versions (e.g. 1.0.0-beta.1) go on the beta dist-tag.
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
